<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0f172a">Superset AI Text-to-SQL POC</text>
  <text x="40" y="82" font-size="17" fill="#475569">Architecture: a customised Apache Superset 6.1 talking to a local Qwen model served by Ollama</text>

  <!-- Browser -->
  <rect x="40" y="210" width="240" height="300" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="248" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">User's browser</text>
  <text x="160" y="276" font-size="14" fill="#475569" text-anchor="middle">http://localhost:8088</text>
  <rect x="58" y="300" width="204" height="58" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="160" y="325" font-size="15" font-weight="600" fill="#0c4a6e" text-anchor="middle">AI Assistant page</text>
  <text x="160" y="345" font-size="13" fill="#0c4a6e" text-anchor="middle">question → SQL · dashboard</text>
  <rect x="58" y="372" width="204" height="58" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="160" y="397" font-size="15" font-weight="600" fill="#0c4a6e" text-anchor="middle">SQL Lab panel</text>
  <text x="160" y="417" font-size="13" fill="#0c4a6e" text-anchor="middle">Text-to-SQL for ad-hoc queries</text>
  <text x="160" y="470" font-size="13" fill="#475569" text-anchor="middle">Superset dashboards</text>
  <text x="160" y="490" font-size="13" fill="#475569" text-anchor="middle">&amp; charts (native UI)</text>

  <!-- Kubernetes -->
  <rect x="400" y="110" width="800" height="690" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="424" y="145" font-size="19" font-weight="700" fill="#0f172a">Docker Desktop Kubernetes</text>
  <text x="424" y="167" font-size="14" fill="#475569">namespace <tspan font-family="Consolas, monospace">superset-ai</tspan> · access via <tspan font-family="Consolas, monospace">kubectl port-forward</tspan></text>

  <!-- Superset pod -->
  <rect x="424" y="185" width="752" height="310" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="446" y="215" font-size="18" font-weight="700" fill="#155e75">Pod: Apache Superset 6.1.0</text>
  <rect x="446" y="232" width="708" height="246" rx="12" fill="#ffffff" stroke="#22b8cf" stroke-width="1.5"/>
  <text x="466" y="260" font-size="16" font-weight="700" fill="#0f172a">superset_ai extension</text>
  <text x="1134" y="260" font-size="13" fill="#64748b" text-anchor="end">Flask blueprint + JavaScript, no frontend fork</text>

  <rect x="466" y="278" width="330" height="88" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="482" y="303" font-size="15" font-weight="600" fill="#115e59">views.py</text>
  <text x="482" y="326" font-size="13" fill="#334155">/ai page and REST API, menu hook,</text>
  <text x="482" y="345" font-size="13" fill="#334155">dashboard / chart / dataset creation</text>
  <rect x="806" y="278" width="330" height="88" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="822" y="303" font-size="15" font-weight="600" fill="#115e59">llm.py</text>
  <text x="822" y="326" font-size="13" fill="#334155">prompts, JSON-schema output,</text>
  <text x="822" y="345" font-size="13" fill="#334155">self-correction loop</text>
  <rect x="466" y="378" width="330" height="88" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="482" y="403" font-size="15" font-weight="600" fill="#115e59">dati.py</text>
  <text x="482" y="426" font-size="13" fill="#334155">schema description for the model,</text>
  <text x="482" y="445" font-size="13" fill="#334155">read-only query execution</text>
  <rect x="806" y="378" width="330" height="88" rx="9" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="822" y="403" font-size="15" font-weight="600" fill="#115e59">sqlguard.py</text>
  <text x="822" y="426" font-size="13" fill="#334155">single SELECT only (sqlglot),</text>
  <text x="822" y="445" font-size="13" fill="#334155">logic lint (e.g. COUNT(*) on lines)</text>

  <!-- Postgres pod -->
  <rect x="424" y="530" width="752" height="250" rx="14" fill="#eff6ff" stroke="#336791" stroke-width="2"/>
  <text x="446" y="560" font-size="18" font-weight="700" fill="#1e3a5f">Pod: PostgreSQL 16</text>
  <rect x="446" y="578" width="340" height="186" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="464" y="604" font-size="16" font-weight="700" fill="#0f172a">DB <tspan font-family="Consolas, monospace">vendite</tspan> (sample data)</text>
  <text x="464" y="630" font-size="13" fill="#334155">customers, products, orders, order lines</text>
  <text x="464" y="652" font-size="13" fill="#334155">views: <tspan font-family="Consolas, monospace">v_vendite</tspan>, <tspan font-family="Consolas, monospace">v_vendite_tutte</tspan>,</text>
  <text x="464" y="672" font-size="13" fill="#334155"><tspan font-family="Consolas, monospace">v_ordini</tspan> + comments that guide the model</text>
  <rect x="464" y="692" width="304" height="52" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="616" y="714" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">role <tspan font-family="Consolas, monospace">ai_reader</tspan>: SELECT only</text>
  <text x="616" y="733" font-size="12" fill="#14532d" text-anchor="middle">read-only transactions · 30 s timeout</text>
  <rect x="814" y="578" width="340" height="186" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="832" y="604" font-size="16" font-weight="700" fill="#0f172a">DB <tspan font-family="Consolas, monospace">superset</tspan> (metadata)</text>
  <text x="832" y="630" font-size="13" fill="#334155">users and permissions</text>
  <text x="832" y="652" font-size="13" fill="#334155">datasets, charts, dashboards</text>
  <text x="832" y="674" font-size="13" fill="#334155">created by the AI assistant</text>

  <!-- Spark -->
  <rect x="1290" y="210" width="270" height="300" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1425" y="244" font-size="20" font-weight="700" fill="#14532d" text-anchor="middle">DGX Spark</text>
  <text x="1425" y="266" font-size="13" fill="#166534" text-anchor="middle">company network / VPN</text>
  <rect x="1308" y="288" width="234" height="102" rx="9" fill="#ffffff" stroke="#4ade80"/>
  <text x="1425" y="316" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Ollama · port 11434</text>
  <text x="1425" y="342" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">Qwen3.6 · 35B params</text>
  <text x="1425" y="364" font-size="13" fill="#334155" text-anchor="middle">~22 GB model</text>
  <text x="1425" y="460" font-size="13" fill="#166534" text-anchor="middle">121 GB unified memory</text>
  <text x="1425" y="480" font-size="13" fill="#166534" text-anchor="middle">(shared with other teams)</text>

  <!-- Arrows -->
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <path d="M280,300 L424,300"/>
    <path d="M424,420 L280,420" />
    <path d="M1176,300 L1290,300"/>
    <path d="M1290,420 L1176,420"/>
    <path d="M730,478 L730,578"/>
    <path d="M980,478 L980,578"/>
  </g>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <g><circle cx="352" cy="300" r="15" fill="#0f172a"/><text x="352" y="305">1</text></g>
    <g><circle cx="352" cy="420" r="15" fill="#0f172a"/><text x="352" y="425">5</text></g>
    <g><circle cx="1233" cy="300" r="15" fill="#0f172a"/><text x="1233" y="305">2</text></g>
    <g><circle cx="1233" cy="420" r="15" fill="#0f172a"/><text x="1233" y="425">3</text></g>
    <g><circle cx="730" cy="528" r="15" fill="#0f172a"/><text x="730" y="533">4</text></g>
    <g><circle cx="980" cy="528" r="15" fill="#0f172a"/><text x="980" y="533">6</text></g>
  </g>

  <!-- Legend -->
  <text x="40" y="836" font-size="17" font-weight="700" fill="#0f172a">Request flow</text>
  <g font-size="14.5" fill="#334155">
    <text x="40" y="864"><tspan font-weight="700">1</tspan>  The user asks a question in Italian, or describes a dashboard.</text>
    <text x="40" y="888"><tspan font-weight="700">2</tspan>  The extension sends the question plus a description of the schema (comments, sample values, reference periods) to Ollama.</text>
    <text x="40" y="912"><tspan font-weight="700">3</tspan>  Qwen answers with structured JSON: the SQL, or a dashboard plan with one query per chart.</text>
    <text x="40" y="936"><tspan font-weight="700">4</tspan>  Each query is validated (single SELECT) and run read-only as <tspan font-family="Consolas, monospace">ai_reader</tspan>; on error or wrong shape, the model is asked to fix it.</text>
    <text x="40" y="960"><tspan font-weight="700">5-6</tspan>  The page calls Superset's REST API to create (or update, never duplicate) dataset, chart and dashboard, stored in the metadata DB.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
